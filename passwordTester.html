<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saturday Lab Class Site</title>
<style>
  :root {font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color-scheme:dark;}
  * {box-sizing:border-box;}
  body {min-height:100vh;margin:0;padding:20px;display:flex;align-items:center;justify-content:center;
        background:radial-gradient(circle at 15% 10%,#233756,transparent 42%),linear-gradient(140deg,#090f1c,#101a2c);color:#fff;}
  .card {width:100%;max-width:430px;background:#172236;border:1px solid #33435e;border-radius:20px;padding:32px;
         box-shadow:0 18px 55px #0006;transition:max-width .2s ease;}
  .card.logged-in {max-width:680px;background:#241923;border-color:#93313a;}
  .icon {width:54px;height:54px;display:grid;place-items:center;background:#2d5397;border-radius:15px;font-size:26px;margin-bottom:22px;}
  .logged-in .icon {margin:0 auto 15px;background:#ac2836;}
  h1 {margin:0 0 8px;font-size:26px;}
  .subtitle {color:#b9c7dd;line-height:1.5;margin:0 0 24px;}
  label {display:block;margin:0 0 8px;font-size:14px;font-weight:600;}
  input {display:block;width:100%;padding:14px;border:1px solid #536784;border-radius:10px;background:#0c1728;color:white;
         font:inherit;margin-bottom:18px;outline:none;}
  input:focus {border-color:#83b7ff;box-shadow:0 0 0 3px #83b7ff30;}
  button {display:block;width:100%;padding:14px;border:0;border-radius:10px;background:#5b9bff;color:#0a1930;
          font:inherit;font-weight:750;cursor:pointer;}
  button:hover {filter:brightness(1.1);}
  button:focus-visible {outline:3px solid white;outline-offset:3px;}
  .error {margin:0 0 14px;color:#ffb0ad;font-siN                                                                                                                              ze:14px;min-height:18px;}
  .small {margin:18px 0 0;color:#a5b4cd;font-size:12px;text-align:center;}
  [hidden] {display:none!important;}
  #success {text-align:center;}
  #success h1 {font-size:30px;color:#fff;}
  #success .subtitle {margin:0 0 15px;}
  .photo {display:block;width:100%;height:auto;border-radius:13px;border:1px solid #a43643;margin:0 auto 10px;}
  .note {font-size:12px;color:#ceb8bc;margin:0 0 18px;}
  #logout {background:#d63243;color:#fff;}
  noscript p {background:#54242d;color:#fff;border-radius:8px;padding:14px;}
  @media (max-width:520px) {.card {padding:23px;} #success h1 {font-size:25px;}}
</style>
</head>
<body>
<main class="card" id="card">
<section id="login">
  <div class="icon" aria-hidden="true">🔐</div>
  <h1>Saturday Lab Class Site</h1>
  <p class="subtitle">Welcome back! Sign in to continue.</p>
  <form id="loginForm" autocomplete="on">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" placeholder="Enter username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
    <p class="error" id="error" aria-live="polite"></p>
    <button id="signIn" type="submit">Sign in</button>
  </form>
  <noscript><p>This interactive demo needs JavaScript. Please open this HTML file in Safari, Chrome, Edge, or Firefox instead of a document preview.</p></noscript>
  <p class="small">Demo only · Not for storing real passwords</p>
</section>

<script>
(function () {
  'use strict';
  // Educational front-end demo ONLY. These credentials are visible in source code.
  // Same username can be used with ANY of the passwords below.
  // Edit this list to add or remove demo passwords.
  var USERNAME = 'admin';
  var VALID_PASSWORDS = [
    'Admin@123',
    'Lab@2026',
    'Saturday@123'
  ];
  var loginForm = document.getElementById('loginForm');
  var login = document.getElementById('login');
  var success = document.getElementById('success');
  var error = document.getElementById('error');
  var card = document.getElementById('card');
  var username = document.getElementById('username');
  var password = document.getElementById('password');

  function showLogin() {
    success.hidden = true;
    login.hidden = false;
    card.classList.remove('logged-in');
    error.textContent = '';
    loginForm.reset();
    username.focus();
  }
  function showSuccess(name) {
    error.textContent = '';
    document.getElementById('welcomeUser').textContent = name;
    login.hidden = true;
    success.hidden = false;
    card.classList.add('logged-in');
    window.scrollTo(0, 0);
  }
  loginForm.addEventListener('submit', function (event) {
    event.preventDefault();
    var enteredName = username.value.trim();
    var enteredPassword = password.value;
    if (enteredName === USERNAME && VALID_PASSWORDS.indexOf(enteredPassword) !== -1) {
      showSuccess(enteredName);
    } else {
      error.textContent = 'Incorrect username or password. Please try again.';
    }
  });
  document.getElementById('logout').addEventListener('click', showLogin);
})();
</script>
